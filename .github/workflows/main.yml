
name: Gerar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar ferramentas
        run: |
          sdkmanager --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709"

      - name: Exportar APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIPLO-C-MOTORBIKE-WORLD-APK
          path: build/*.apk
          if-no-files-found: error
          
